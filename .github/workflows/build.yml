name: build

# 三平台原生构建：每个平台在自己的 runner 上编译，不做交叉编译。
# 产物在 Actions 运行页面的 Artifacts 区下载。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# apt 在非交互环境下会卡在 needrestart / tzdata 的确认提示上。
env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 单个目标的硬上限，避免卡在下载或 apt 上无限占用额度。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows（NSIS 安装包，附带对应架构的 wintun.dll）
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            wintun: x86
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            wintun: amd64
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            wintun: arm64

          # ---------------- macOS（.app + .dmg）
          # 只出一个通用包：同时包含 arm64 与 x86_64，用户不会装错架构。
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

          # ---------------- Linux（deb + rpm + AppImage）
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 通用包需要同时装两个架构的标准库。
          targets: ${{ matrix.rust-targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux 需要 WebKitGTK 与打包工具。
      #
      # runner 的 apt 偶发卡死：镜像开机时会跑 unattended-upgrades 抢占 dpkg 锁，
      # 且个别镜像源会长时间无响应。这里先停掉自动升级，再给 apt 加上超时与重试，
      # 避免整条流水线被一个下载拖到 20 分钟超时。
      - name: Linux 依赖
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl disable unattended-upgrades 2>/dev/null || true

          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Get::Assume-Yes=true -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"

          for attempt in 1 2 3; do
            echo "apt-get update（第 $attempt 次）"
            if sudo apt-get update $APT_OPTS; then break; fi
            sleep 5
          done

          sudo apt-get install -y $APT_OPTS --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm


      # Wintun 是第三方驱动，不随仓库分发；按目标架构取对应 DLL。
      - name: 准备 wintun.dll
        if: runner.os == 'Windows'
        run: pwsh -File scripts/fetch-wintun.ps1 -Architecture ${{ matrix.wintun }} -CopyToTarget

      - run: npm ci

      - name: 单元测试
        run: cargo test --workspace --lib

      - name: 构建安装包
        timeout-minutes: 25
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evergreen-lan-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn
