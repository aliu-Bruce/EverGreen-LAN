name: macOS 真机验证

# 在 GitHub 托管的 Apple Silicon(M1) runner 上验证 utun 建卡全链路。
# 触发:网页 Actions 页手动点 Run workflow。
on:
  workflow_dispatch:

jobs:
  # 关键验证:真实创建 utun 网卡、配址、建路由、ping 隧道地址。
  tun-verify:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go 全量测试(进程内逻辑)
        working-directory: core
        run: go test ./...

      - name: 编译核心
        working-directory: core
        run: go build -o "../dist/egland-macos-verify" ./cmd/egland

      - name: 提权开房,验证 utun 建卡
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # 后台起 host;utun 必须由 root 创建
          sudo nohup ./dist/egland-macos-verify -role host -code EGLANTEST -listen 47777 > /tmp/egland-host.log 2>&1 &
          sleep 4

          echo "===== 进程 ====="
          ps aux | grep '[e]gland-macos-verify' || true

          echo "===== utun 接口(应出现一块带 10.66.7.1 的) ====="
          ifconfig | grep -B2 -A4 '10.66.7.1' || true

          echo "===== 隧道地址 ====="
          ifconfig | grep '10.66.7' || true

          echo "===== 隧道路由 ====="
          netstat -rn | grep '10.66.7' || true

          echo "===== UDP 47777 监听 ====="
          lsof -nP -iUDP:47777 || true

          echo "===== ping 隧道地址 ====="
          ping -c 2 10.66.7.1 || true

          echo "===== 核心日志 ====="
          cat /tmp/egland-host.log || true

          # 硬判定:拿不到隧道地址就失败
          ifconfig | grep -q '10.66.7.1'

      - name: 清理(无论成败)
        if: always()
        shell: bash
        run: |
          sudo pkill -f 'egland-macos-verify' 2>/dev/null || true
          sleep 1
          echo "===== 清理后隧道(应为空) ====="
          ifconfig | grep '10.66.7' || echo "隧道已清理"

  # 附加:证明 macOS UI 能编译(不要求真机交互)
  ui-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter 依赖
        working-directory: ui
        run: flutter pub get

      - name: 分析
        working-directory: ui
        run: flutter analyze

      - name: 测试
        working-directory: ui
        run: flutter test

      - name: 编译 macOS 应用(不签名)
        working-directory: ui
        run: flutter build macos --release --no-codesign
