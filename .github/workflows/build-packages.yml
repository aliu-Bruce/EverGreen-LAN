name: 多平台打包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # ---------- Windows x64 ----------
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 编译核心(Windows amd64)
        working-directory: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\build-core | Out-Null
          $env:GOOS='windows'; $env:GOARCH='amd64'
          go build -o ..\build-core\egland.exe .\cmd\egland
      - name: 放置 wintun 到 dist(打包脚本从此取用)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'packaging/windows/wintun.dll' 'dist/wintun.dll' -Force
          Copy-Item 'packaging/windows/wintun-LICENSE.txt' 'dist/wintun-LICENSE.txt' -Force
      - name: Flutter 依赖与构建
        working-directory: ui
        run: |
          flutter pub get
          flutter build windows --release
      - name: 安装 WiX v3
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
      - name: 打包 zip + msi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & './packaging/windows/package.ps1' `
            -BuildDir 'ui/build/windows/x64/runner/Release' `
            -Arch 'x64' -CoreExe 'build-core/egland.exe' -OutDir 'out'
      - uses: actions/upload-artifact@v4
        with: { name: windows-x64, path: out/*.zip }
      - uses: actions/upload-artifact@v4
        with: { name: windows-x64-msi, path: out/*.msi }

  # ---------- Windows arm64 ----------
  win-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 编译核心(Windows arm64)
        working-directory: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\build-core | Out-Null
          $env:GOOS='windows'; $env:GOARCH='arm64'
          go build -o ..\build-core\egland.exe .\cmd\egland
      - name: 放置 wintun 到 dist(打包脚本从此取用)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'packaging/windows/wintun.dll' 'dist/wintun.dll' -Force
          Copy-Item 'packaging/windows/wintun-LICENSE.txt' 'dist/wintun-LICENSE.txt' -Force
      - name: Flutter 依赖与构建
        working-directory: ui
        run: |
          flutter pub get
          flutter build windows --release
      - name: 安装 WiX v3
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
      - name: 打包 zip + msi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & './packaging/windows/package.ps1' `
            -BuildDir 'ui/build/windows/arm64/runner/Release' `
            -Arch 'arm64' -CoreExe 'build-core/egland.exe' -OutDir 'out'
      - uses: actions/upload-artifact@v4
        with: { name: windows-arm64, path: out/*.zip }
      - uses: actions/upload-artifact@v4
        with: { name: windows-arm64-msi, path: out/*.msi }

  # ---------- Linux x64 ----------
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm
          sudo gem install fpm --no-document
      - name: 编译核心(Linux amd64)
        working-directory: core
        run: |
          mkdir -p ../build-core
          GOOS=linux GOARCH=amd64 go build -o ../build-core/egland ./cmd/egland
      - name: Flutter 依赖与构建
        working-directory: ui
        run: |
          flutter pub get
          flutter build linux --release
      - name: 打包
        run: |
          chmod +x packaging/linux/package.sh
          mkdir -p out
          ./packaging/linux/package.sh \
            'ui/build/linux/x64/release/bundle' 'x64' 'build-core/egland' 'out'
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64, path: out/* }

  # ---------- Linux arm64 ----------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm
          sudo gem install fpm --no-document
      - name: 编译核心(Linux arm64)
        working-directory: core
        run: |
          mkdir -p ../build-core
          GOOS=linux GOARCH=arm64 go build -o ../build-core/egland ./cmd/egland
      - name: Flutter 依赖与构建
        working-directory: ui
        run: |
          flutter pub get
          flutter build linux --release
      - name: 打包
        run: |
          chmod +x packaging/linux/package.sh
          mkdir -p out
          ./packaging/linux/package.sh \
            'ui/build/linux/arm64/release/bundle' 'arm64' 'build-core/egland' 'out'
      - uses: actions/upload-artifact@v4
        with: { name: linux-arm64, path: out/* }

  # ---------- macOS arm64 ----------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 编译核心(darwin arm64)
        working-directory: core
        run: |
          mkdir -p ../build-core
          GOOS=darwin GOARCH=arm64 go build -o ../build-core/egland ./cmd/egland
      - name: 生成 macOS 脚手架
        working-directory: ui
        run: |
          if [ ! -d macos ]; then flutter create --platforms=macos .; fi
          flutter pub get
      - name: 构建 macOS arm64
        working-directory: ui
        run: flutter build macos --release --no-codesign
      - name: 打包 dmg
        run: |
          chmod +x packaging/macos/package.sh
          mkdir -p out
          ./packaging/macos/package.sh \
            'ui/build/macos/Build/Products/Release/eglan_ui.app' \
            'build-core/egland' 'out/EverGreen-LAN-macos-arm64.dmg' 'EverGreen LAN ARM'
          tar -czf app-arm64.tgz -C ui/build/macos/Build/Products/Release eglan_ui.app
      - uses: actions/upload-artifact@v4
        with: { name: macos-arm64, path: out/*.dmg }
      - uses: actions/upload-artifact@v4
        with: { name: app-arm64, path: app-arm64.tgz }

  # ---------- macOS x64 ----------
  macos-x64:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 编译核心(darwin amd64)
        working-directory: core
        run: |
          mkdir -p ../build-core
          GOOS=darwin GOARCH=amd64 go build -o ../build-core/egland ./cmd/egland
      - name: 生成 macOS 脚手架
        working-directory: ui
        run: |
          if [ ! -d macos ]; then flutter create --platforms=macos .; fi
          flutter pub get
      - name: 构建 macOS x64
        working-directory: ui
        run: flutter build macos --release --no-codesign
      - name: 打包 dmg
        run: |
          chmod +x packaging/macos/package.sh
          mkdir -p out
          ./packaging/macos/package.sh \
            'ui/build/macos/Build/Products/Release/eglan_ui.app' \
            'build-core/egland' 'out/EverGreen-LAN-macos-x64.dmg' 'EverGreen LAN Intel'
          tar -czf app-x64.tgz -C ui/build/macos/Build/Products/Release eglan_ui.app
      - uses: actions/upload-artifact@v4
        with: { name: macos-x64, path: out/*.dmg }
      - uses: actions/upload-artifact@v4
        with: { name: app-x64, path: app-x64.tgz }

  # ---------- macOS universal ----------
  macos-universal:
    needs: [macos-arm64, macos-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app-arm64, path: armsrc }
      - uses: actions/download-artifact@v4
        with: { name: app-x64, path: x64src }
      - name: 解包
        run: |
          mkdir -p arm x64
          tar -xzf armsrc/app-arm64.tgz -C arm
          tar -xzf x64src/app-x64.tgz -C x64
      - name: lipo 合并二进制
        run: |
          APP=arm/eglan_ui.app
          XAPP=x64/eglan_ui.app
          lipo -create "$APP/Contents/MacOS/eglan_ui" "$XAPP/Contents/MacOS/eglan_ui" -output "$APP/Contents/MacOS/eglan_ui"
          lipo -create "$APP/Contents/MacOS/egland" "$XAPP/Contents/MacOS/egland" -output "$APP/Contents/MacOS/egland"
          FB="$APP/Contents/Frameworks/Flutter.framework/Versions/A/Flutter"
          XFB="$XAPP/Contents/Frameworks/Flutter.framework/Versions/A/Flutter"
          if [ -f "$FB" ] && [ -f "$XFB" ]; then lipo -create "$FB" "$XFB" -output "$FB"; fi
      - name: 打包 universal dmg
        run: |
          mkdir -p out
          hdiutil create -volname 'EverGreen LAN Universal' \
            -srcfolder arm/eglan_ui.app -ov -format UDZO \
            'out/EverGreen-LAN-macos-universal.dmg'
      - uses: actions/upload-artifact@v4
        with: { name: macos-universal, path: out/*.dmg }
